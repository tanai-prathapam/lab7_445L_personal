   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #526074" transform="translate(39.6 721.153828)">An unused readable ID enables selection. Used IDs are denied. Launch mode controls launching only; effects run in both modes.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #526074" transform="translate(39.6 733.283438)">Used ID commit: after coil stop if launch is OFF, after the commanded launch if ON. No physical completion sensors.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #526074" transform="translate(39.6 745.413047)">Reset and Emergency Stop are Master Mode options. Both speakers play background music. Audio source / routing: TBD.</text>
   </g>
